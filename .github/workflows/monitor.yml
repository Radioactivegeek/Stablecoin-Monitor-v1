name: Stablecoin Peg & Pool Monitor

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitor Script
        run: python scripts/stablecoin_peg_pool_monitor.py

      - name: Commit and Push Log Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peg_monitor_log.csv
          if git diff --staged --quiet; then
            echo "No log updates to commit."
          else
            git commit -m "chore(telemetry): record hourly peg & liquidity metrics [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi